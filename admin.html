<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Administración | LC Commerce</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background: #0b1020;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .admin-container {
      max-width: 850px;
      margin: auto;
    }
    .admin-header {
      text-align: center;
      padding: 25px 10px;
    }
    .admin-header h1 {
      color: #fbbf24;
      margin-bottom: 6px;
    }
    .admin-card {
      background: #141e32;
      border: 1px solid #293650;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 18px;
    }
    input, button, select {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 16px;
    }
    input, select, textarea {
      background: #0b1426;
      color: white;
      border: 1px solid #394763;
    }
    button {
      background: #fbbf24;
      color: #171717;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      background: #263650;
      color: white;
    }
    a.store-link {
      display: block;
      margin-top: 10px;
      padding: 13px;
      border-radius: 9px;
      background: #263650;
      color: #fbbf24;
      text-align: center;
      font-weight: bold;
      text-decoration: none;
    }
    #adminPanel {
      display: none;
    }
    #storePicker {
      display: none;
    }
    #message {
      margin-top: 12px;
      color: #fbbf24;
      overflow-wrap: anywhere;
    }
    .admin-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .admin-menu button:last-child {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <main class="admin-container">
    <header class="admin-header">
      <h1>LC COMMERCE</h1>
      <p>Panel de administración</p>
    </header>

    <section class="admin-card" id="loginPanel">
      <h2>Acceso administrativo</h2>
      <p>Ingresa con la cuenta que recibiste en tu invitación.</p>

      <form id="loginForm">
        <input
          type="email"
          id="email"
          placeholder="Correo electrónico"
          autocomplete="username"
          required
        >
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >
        <button type="submit">Iniciar sesión</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section id="adminPanel">
      <div class="admin-card">
        <h2 id="welcomeTitle">Bienvenido</h2>
        <p>Tu sesión administrativa está activa.</p>

        <div id="storePicker">
          <label for="storeSelect">Negocio</label>
          <select id="storeSelect"></select>
        </div>

        <div class="admin-menu">
          <button type="button" id="productsBtn">📦 Productos</button>
          <button type="button" id="categoriesBtn">🏷️ Categorías</button>
          <button type="button" id="ordersBtn">🧾 Pedidos</button>
          <button type="button" id="imagesBtn">🖼️ Imágenes</button>
          <button type="button" id="businessBtn">🏪 Mi negocio</button>
        </div>

        <a
          id="storeLink"
          class="store-link"
          href="./"
          target="_blank"
          rel="noopener noreferrer">
          👀 Ver mi tienda
        </a>

        <button type="button" class="secondary" id="logoutBtn">
          Cerrar sesión
        </button>
      </div>

      <div class="admin-card" id="workspace">
        <h3>Administración</h3>
        <p>Selecciona una sección para comenzar.</p>
      </div>
    </section>
  </main>
<script>
  const script = document.createElement("script");
  script.src = "./admin.js?v=" + Date.now();
  document.body.appendChild(script);
</script>
</body>
</html>
